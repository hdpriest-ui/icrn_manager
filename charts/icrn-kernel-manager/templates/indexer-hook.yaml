{{- if .Values.indexer.runOnDeploy }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-indexer-hook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icrn.labels" . | nindent 4 }}
    component: kernel-indexer
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "icrn.labels" . | nindent 8 }}
        component: kernel-indexer
    spec:
      {{- include "icrn.indexerPodSpec" . | nindent 6 }}
{{- end }}
